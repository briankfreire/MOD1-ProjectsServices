[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "projects-service"
version = "0.3.0"
description = "Projetos privados por responsavel - MVP do modulo de Brian"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.6,<3", "certifi",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "httpx2>=2,<3", "ruff>=0.8,<1", "mypy>=1.13,<2", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[project.scripts]
projects-service = "projects_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/projects_service"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/projects_service", "/tests", "/docs", "/pyproject.toml", "/uv.lock",
  "/README.md", "/CHANGELOG.md", "/.env.example", "/.gitignore", "/.gitattributes",
]
exclude = [
  "**/__pycache__/**", "**/*.pyc", "**/.superpowers/**", "**/superpowers/**",
  "**/AGENTS.md", "**/agents.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/projects_service"]
